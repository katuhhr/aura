services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/aistor/minio:latest
    command: ["server", "/data", "--license", "/minio.license", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - type: bind
        source: "${AURA_MINIO_DATA_DIR:-C:/minio/data}"
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: "${AURA_MINIO_LICENSE_FILE:-C:/minio/minio.license}"
        target: /minio.license
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped


  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_HOST: "${AURA_DATABASE_HOST:-host.docker.internal}"
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: "${AURA_MINIO_ENDPOINT:-minio:9000}"
    ports:
      - "${AURA_BACKEND_PORT:-5000}:5000"
    depends_on:
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 10

  web:
    build: ../web
    ports:
      - "${AURA_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
